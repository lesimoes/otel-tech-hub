apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: traceID
          matcherRegex: 'trace_id=([a-fA-F0-9]{32})'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View in Tempo
        - name: traceID
          matcherType: label
          matcherRegex: 'trace_id'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View in Tempo
